{% extends "base.html" %}
{% block content %}
<h2>All Users</h2>
<table border="1" cellpadding="8">
    <tr><th>Name</th><th>Email</th><th>Role</th></tr>
    {% for u in users %}
    <tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td></tr>
    {% endfor %}
</table>
<p><a href="{{ url_for('admin_dashboard') }}">Back to dashboard</a></p>
{% endblock %}
